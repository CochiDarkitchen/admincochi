<!DOCTYPE html>
<html lang="es">
<head>
<link rel="manifest" href="/manifest.json">

<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">

<link rel="apple-touch-icon" sizes="192x192" href="/icons/cochi-192.png">

<meta name="theme-color" content="#171719">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="COCHI">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COCHI — Administración</title>
<style>
:root{
  --bg:#1c1a17; --bg2:#242019; --bg3:#2e2820; --border:#3d362b;
  --text:#f3ede2; --dim:#b3a591; --accent:#e8a33d; --accent-d:#c8842a;
  --green:#7db07d; --blue:#7ba3b8; --red:#c9705f; --yellow:#d9c25e;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
input,select,textarea{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:1px solid var(--accent)}
label{font-size:13px;color:var(--dim);display:block;margin-bottom:4px}
.field{margin-bottom:12px}
button{cursor:pointer;border:none;border-radius:8px;padding:9px 16px;font-weight:600}
button:disabled{opacity:.6;cursor:default}
.btn-primary{background:var(--accent);color:#241a08}
.btn-primary:hover{background:var(--accent-d)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--accent)}
.btn-danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn-sm{padding:5px 10px;font-size:13px}
a{color:var(--accent)}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:36px 32px;width:100%;max-width:360px}
.login-box h1{font-size:26px;margin-bottom:2px}
.login-box p{color:var(--dim);font-size:14px;margin-bottom:22px}
.login-err{color:var(--red);font-size:13px;margin-top:8px;min-height:16px}

/* shell */
#shell{display:flex;min-height:100vh}
#sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);padding:20px 14px;flex-shrink:0}
#sidebar h1{font-size:20px;margin-bottom:2px}
#sidebar .tag{color:var(--dim);font-size:12px;margin-bottom:22px}
.nav-item{display:block;width:100%;text-align:left;background:none;border:none;color:var(--dim);padding:10px 12px;border-radius:8px;margin-bottom:2px;font-weight:500}
.nav-item.active{background:var(--bg3);color:var(--accent)}
.nav-item:hover{color:var(--text)}
#logout{margin-top:20px;width:100%}
main{flex:1;padding:26px 30px;max-width:1100px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:10px}
.topbar h2{font-size:22px}
#mobile-nav{display:none}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card .label{color:var(--dim);font-size:13px}
.card .val{font-size:24px;font-weight:700;margin-top:4px}
.card .sub{font-size:12px;color:var(--dim);margin-top:2px}

/* tables */
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--dim);padding:12px 14px;border-bottom:1px solid var(--border)}
td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:14px}
tr:last-child td{border-bottom:none}
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{width:auto;min-width:140px}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600}
.b-pendiente{background:#4a4126;color:var(--yellow)}
.b-preparacion{background:#2c3d47;color:var(--blue)}
.b-lista{background:#2c3d47;color:var(--blue)}
.b-delivery{background:#2c3d47;color:var(--blue)}
.b-completada{background:#2e4530;color:var(--green)}
.b-cancelada{background:#4a2c26;color:var(--red)}
.empty{padding:40px;text-align:center;color:var(--dim)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:50}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:26px;width:100%;max-width:560px}
.modal h3{margin-bottom:16px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* order builder */
.ob-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.prod-pick{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px solid var(--border)}
.prod-pick:last-child{border-bottom:none}
.cart-line{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px solid var(--border)}
.cart-line:last-child{border-bottom:none}
.summary-line{display:flex;justify-content:space-between;font-size:14px;padding:4px 0}
.summary-line.total{font-weight:700;font-size:17px;border-top:1px solid var(--border);margin-top:8px;padding-top:10px}
.qty-ctrl{display:flex;align-items:center;gap:6px}
.qty-ctrl button{padding:2px 10px;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;font-weight:700}
.qty-ctrl button:hover{border-color:var(--accent)}

/* ticket */
#ticket{display:none}
@media print{
  body>*:not(#ticket-overlay){display:none!important}
  #ticket-overlay{position:static;background:none;padding:0}
  #ticket{display:block!important;width:58mm;font-family:monospace;font-size:11px;color:#000;padding:4px}
  #ticket hr{border:none;border-top:1px dashed #000;margin:6px 0}
  #ticket .c{text-align:center}
  #ticket .row{display:flex;justify-content:space-between}
}
.ticket-preview .c{text-align:center}
.ticket-preview .row{display:flex;justify-content:space-between;padding:2px 0}
.ticket-preview hr{border:none;border-top:1px dashed #999;margin:6px 0}

/* toast */
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:100;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{border-color:var(--red);color:var(--red)}

@media (max-width:820px){
  #sidebar{display:none}
  main{padding:16px;max-width:100%}
  #mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);z-index:40}
  #mobile-nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;color:var(--dim);padding:8px 2px;border-radius:0}
  #mobile-nav button.active{color:var(--accent)}
  #shell{padding-bottom:60px}
  .ob-grid{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr}
  .panel{overflow-x:auto}
  table{min-width:540px}
  .card .val{font-size:20px}
  #toast{bottom:70px}
}


/* ==========================================================
   COCHI UX 2.0 — interacción táctil y diseño móvil
   Capa visual adicional: no elimina estilos ni funciones previas.
   ========================================================== */
:root{
  --tap-size:46px;
  --safe-bottom:env(safe-area-inset-bottom, 0px);
  --shadow-soft:0 10px 30px rgba(0,0,0,.16);
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
body{line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
button{min-height:42px;transition:background .15s ease,border-color .15s ease,transform .12s ease;}
button:active{transform:scale(.985);}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
input,select,textarea{min-height:44px;line-height:1.35;}
textarea{resize:vertical;}
#shell{min-width:0;}
main{min-width:0;width:100%;}
.topbar{align-items:center;}
.topbar h2{letter-spacing:-.025em;}
.topbar .btn-primary,.topbar .btn-ghost{white-space:nowrap;}
.card{box-shadow:0 2px 6px rgba(0,0,0,.06);}
.card .label{line-height:1.3;}
.toolbar{min-width:0;}
.toolbar input:focus,.toolbar select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 17%,transparent);}

/* Diálogo: área desplazable propia, botones siempre fáciles de alcanzar */
body.modal-open{overflow:hidden;}
.overlay{align-items:center;overscroll-behavior:contain;backdrop-filter:blur(3px);}
.modal{max-height:calc(100dvh - 42px);overflow-y:auto;overscroll-behavior:contain;box-shadow:var(--shadow-soft);scrollbar-gutter:stable;}
.modal h3{line-height:1.25;}
.modal-actions{gap:10px;}
.modal-actions button{min-height:46px;}
.field label{line-height:1.35;}

/* Constructor de órdenes */
.order-mobile-summary{display:none;}
.customer-result{display:flex;width:100%;min-height:58px;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:transparent;color:var(--text);border:0;border-bottom:1px solid var(--border);border-radius:0;padding:11px 4px;}
.customer-result:last-child{border-bottom:0;}
.customer-result:hover,.customer-result:focus-visible{background:var(--bg3);}
.product-pick-button{width:100%;min-height:54px;text-align:left;background:transparent;color:var(--text);border:0;border-bottom:1px solid var(--border);border-radius:0;padding:10px 4px;}
.product-pick-button:hover,.product-pick-button:focus-visible{background:var(--bg3);}
.product-pick-button:last-child{border-bottom:0;}
#orderCartPanel{scroll-margin-top:20px;}
#orderProductList{overscroll-behavior:contain;}

/* Menú adicional móvil */
#mobile-more-menu{display:none;}
#mobile-more-menu.open{display:grid;}

@media(max-width:820px){
  #shell{padding-bottom:calc(78px + var(--safe-bottom));}
  main{padding:16px 13px calc(18px + var(--safe-bottom));}
  .topbar{gap:10px;margin-bottom:17px;align-items:flex-start;}
  .topbar h2{font-size:22px;padding-top:5px;}
  .dashboard-actions{width:100%;align-items:stretch!important;}
  .dashboard-actions>div{flex:1 1 100%;width:100%;}
  .dashboard-actions>button{flex:1 1 135px;white-space:normal!important;}
  .topbar>.btn-primary,.topbar>div>.btn-primary,.topbar>div>.btn-ghost{min-height:44px;}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-bottom:16px;}
  .card{padding:12px;border-radius:12px;min-width:0;}
  .card .label{font-size:12px;}
  .card .val{font-size:clamp(18px,5.1vw,23px);overflow-wrap:anywhere;}
  .card .sub{font-size:11px;}
  .toolbar{display:flex;flex-direction:column;align-items:stretch;gap:9px;margin-bottom:13px;}
  .toolbar input,.toolbar select{width:100%!important;min-width:0!important;}
  .toolbar>button{width:100%;}
  .panel{overflow:visible;border-radius:13px;}
  #root table{width:100%;min-width:0!important;border-collapse:separate;border-spacing:0;}
  #root table thead{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  #root table tbody{display:block;width:100%;}
  #root table tbody tr{display:block;background:var(--bg2);border:1px solid var(--border);border-radius:12px;margin:10px;padding:5px 12px;box-shadow:0 2px 6px rgba(0,0,0,.06);}
  #root table tbody tr:last-child{margin-bottom:10px;}
  #root table tbody td{display:grid;grid-template-columns:minmax(83px,31%) minmax(0,1fr);align-items:center;gap:10px;width:100%;min-width:0;padding:9px 0;font-size:13px;overflow-wrap:anywhere;border-bottom:1px solid color-mix(in srgb,var(--border) 75%,transparent);}
  #root table tbody td::before{content:attr(data-label);display:block;color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.045em;text-transform:uppercase;line-height:1.3;}
  #root table tbody td[data-label=""]{display:block;padding:9px 0 3px;border-bottom:0;}
  #root table tbody td[data-label=""]::before{display:none;}
  #root table tbody td[colspan]{display:block;text-align:center;padding:16px 8px;}
  #root table tbody td[colspan]::before{display:none;}
  #root table tbody td select{width:100%!important;max-width:100%;min-height:40px;font-size:13px;}
  #root table tbody td button{min-height:40px;padding:8px 10px;}
  #root table tbody td:last-child{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:7px;}
  #root table tbody td:last-child button{flex:1 1 auto;}
  .empty{padding:24px 12px;line-height:1.5;}
  #mobile-nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));min-height:66px;padding:5px 4px calc(5px + var(--safe-bottom));align-items:stretch;box-shadow:0 -8px 24px rgba(0,0,0,.18);}
  #mobile-nav button{min-width:0;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:5px 1px;border-radius:10px;line-height:1.1;}
  #mobile-nav button .nav-icon{font-size:20px;line-height:1;}
  #mobile-nav button .nav-label{font-size:10px;font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #mobile-nav button.active{background:var(--bg3);color:var(--accent);}
  #mobile-nav button[data-more-active="true"]{color:var(--accent);}
  #mobile-more-menu{position:fixed;left:10px;right:10px;bottom:calc(76px + var(--safe-bottom));z-index:41;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px;background:var(--bg2);border:1px solid var(--border);border-radius:16px;box-shadow:0 16px 38px rgba(0,0,0,.4);}
  #mobile-more-menu button{min-width:0;min-height:52px;text-align:left;background:var(--bg3);color:var(--text);border:1px solid var(--border);padding:10px 12px;}
  #mobile-more-menu button.active{border-color:var(--accent);color:var(--accent);}
  .financial-picker-wrap{width:100%!important;min-width:0!important;}
  .financial-picker-btn{min-height:44px;white-space:normal;text-align:left;}
  .financial-calendar{position:fixed!important;left:50%!important;right:auto!important;top:auto!important;bottom:calc(80px + var(--safe-bottom))!important;transform:translateX(-50%);width:min(320px,calc(100vw - 26px))!important;max-width:calc(100vw - 26px)!important;}
  .order-calendar{left:50%!important;right:auto!important;}
  .ob-grid{grid-template-columns:minmax(0,1fr)!important;gap:12px;}
  .ob-grid>div{min-width:0;}
  .ob-grid .row2{grid-template-columns:minmax(0,1fr);gap:0;}
  .order-mobile-summary{display:flex;position:sticky;top:52px;z-index:7;align-items:center;justify-content:space-between;gap:12px;margin:-2px -2px 15px;padding:10px 11px;background:var(--bg3);border:1px solid var(--border);border-radius:12px;box-shadow:0 5px 14px rgba(0,0,0,.16);}
  .order-mobile-summary .oms-copy{min-width:0;display:flex;flex-direction:column;gap:2px;}
  .order-mobile-summary .oms-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;}
  .order-mobile-summary strong{font-size:14px;line-height:1.25;}
  .order-mobile-summary small{font-size:11px;color:var(--dim);}
  .order-mobile-summary button{flex:0 0 auto;min-height:40px;}
  .modal-overlay,.overlay{padding:0;align-items:flex-end;}
  .modal{width:100%!important;max-width:none!important;max-height:calc(100dvh - env(safe-area-inset-top,0px));border-radius:21px 21px 0 0;border-left:0;border-right:0;border-bottom:0;padding:18px 15px calc(12px + var(--safe-bottom));}
  .modal h3{position:sticky;top:-18px;z-index:6;background:var(--bg2);padding:11px 0 12px;margin:0 0 14px;border-bottom:1px solid var(--border);}
  .modal-actions{position:sticky;bottom:calc(-12px - var(--safe-bottom));z-index:5;background:linear-gradient(180deg,color-mix(in srgb,var(--bg2) 86%,transparent),var(--bg2) 28%);padding:14px 0 calc(6px + var(--safe-bottom));margin-top:16px;}
  .modal-actions>button{flex:1;min-width:0;}
  .order-modal .modal{padding-bottom:calc(98px + var(--safe-bottom));}
  .order-modal .modal .order-actions{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;margin:0;padding:12px 15px calc(10px + var(--safe-bottom));border-top:1px solid var(--border);background:var(--bg2);box-shadow:0 -8px 24px rgba(0,0,0,.22);}
  .order-modal .modal .order-actions>button{min-height:48px;}
  .modal .panel{overflow:visible;}
  .modal .prod-pick{gap:12px;}
  .modal .qty-ctrl{gap:6px;flex-wrap:nowrap;}
  .modal .qty-ctrl button{min-width:36px;min-height:38px;padding:5px 10px;}
  #orderProductList{max-height:35dvh!important;}
  #orderCustomerResults{max-height:28dvh!important;}
  #toast{bottom:calc(82px + var(--safe-bottom));width:max-content;max-width:calc(100vw - 28px);}
  .login-box{padding:28px 22px;}
}
@media(min-width:821px){
  #mobile-more-menu{display:none!important;}
  #root table tbody td[data-label=""]::before{display:none;}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto;}*,*::before,*::after{transition:none!important;animation:none!important;}}


/* ==========================================================
   COCHI — Soft Apple-inspired UI
   Diseño visual móvil primero; conserva colores configurables.
   ========================================================== */
:root{
  --radius:20px;
  --tap-size:48px;
  --safe-bottom:env(safe-area-inset-bottom, 0px);
  --cochi-shadow:0 12px 34px rgba(0,0,0,.16);
  --cochi-shadow-small:0 4px 16px rgba(0,0,0,.10);
  --cochi-border:color-mix(in srgb,var(--text) 8%,transparent);
  --cochi-surface:color-mix(in srgb,var(--bg) 90%,white 10%);
  --cochi-surface-raised:color-mix(in srgb,var(--bg) 83%,white 17%);
  --cochi-soft-accent:color-mix(in srgb,var(--accent) 14%,var(--bg2));
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scroll-padding-top:20px;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  letter-spacing:-.012em;line-height:1.48;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;background:var(--bg);overscroll-behavior-y:contain;
}
button,input,select,textarea{font:inherit;letter-spacing:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
button{min-height:44px;border-radius:14px;font-weight:650;transition:background-color .18s ease,border-color .18s ease,box-shadow .18s ease,transform .16s ease,opacity .18s ease;}
button:active{transform:scale(.985);}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;}
button:disabled{opacity:.48;}
input,select,textarea{
  min-height:48px;padding:12px 14px;border-radius:14px;border:1px solid color-mix(in srgb,var(--text) 12%,transparent);
  background:color-mix(in srgb,var(--bg) 80%,white 3%);box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
  transition:border-color .18s ease,box-shadow .18s ease,background-color .18s ease;
}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--dim) 78%,transparent);}
input:focus,select:focus,textarea:focus{outline:none;border-color:color-mix(in srgb,var(--accent) 65%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 15%,transparent);}
input[type="checkbox"]{accent-color:var(--accent);width:20px;height:20px;min-height:20px;}
input[type="color"]{padding:5px;min-height:48px;border-radius:14px;}
label{font-size:12px;font-weight:650;letter-spacing:.015em;color:var(--dim);margin:0 0 7px 2px;}
.field{margin-bottom:15px;}
textarea{resize:vertical;min-height:88px;}
a{color:var(--accent);text-underline-offset:3px;}
#root{min-height:100vh;}
#shell{min-width:0;min-height:100vh;background:var(--bg);}
main{min-width:0;width:100%;max-width:none;padding:30px clamp(20px,3vw,48px);}

/* Navegación escritorio */
#sidebar{
  position:sticky;top:0;align-self:flex-start;width:248px;height:100dvh;overflow-y:auto;flex-shrink:0;
  padding:24px 16px;background:color-mix(in srgb,var(--bg2) 92%,black 8%);
  border-right:1px solid var(--cochi-border);box-shadow:8px 0 34px rgba(0,0,0,.035);
}
#sidebar>img{margin:1px 0 10px 4px;max-width:156px;object-fit:contain;object-position:left center;}
#sidebar h1{font-size:21px;font-weight:750;letter-spacing:-.04em;margin:4px 0 4px 4px;}
#sidebar .tag{margin:0 0 27px 4px;font-size:12px;color:var(--dim);letter-spacing:.01em;}
.nav-item{
  display:flex;align-items:center;gap:12px;width:100%;min-height:46px;margin:4px 0;padding:10px 12px;
  border:1px solid transparent;border-radius:14px;background:transparent;color:var(--dim);text-align:left;font-size:14px;font-weight:580;
}
.nav-item .nav-symbol{width:21px;height:21px;display:inline-grid;place-items:center;flex:0 0 21px;opacity:.9;}
.nav-item .nav-symbol svg{width:19px;height:19px;display:block;}
.nav-item.active{background:var(--cochi-soft-accent);border-color:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent);font-weight:700;}
.nav-item:hover{background:color-mix(in srgb,var(--text) 5%,transparent);color:var(--text);}
.nav-item.active:hover{color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--bg2));}

/* Encabezados */
.topbar{gap:14px;align-items:center;margin-bottom:25px;}
.topbar h2{font-size:clamp(23px,2vw,30px);font-weight:760;letter-spacing:-.045em;line-height:1.13;}
.topbar .btn-primary,.topbar .btn-ghost{white-space:nowrap;}
.topbar .btn-primary{box-shadow:0 5px 14px color-mix(in srgb,var(--accent) 20%,transparent);}
.dashboard-actions{gap:10px!important;}

/* Acciones */
.btn-primary{background:var(--accent);color:#fff;border:1px solid color-mix(in srgb,var(--accent) 87%,black 13%);box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 16%,transparent);}

.btn-ghost{background:color-mix(in srgb,var(--bg2) 83%,var(--text) 3%);color:var(--text);border:1px solid color-mix(in srgb,var(--text) 10%,transparent);}

.btn-danger{background:color-mix(in srgb,var(--red) 9%,transparent);color:var(--red);border:1px solid color-mix(in srgb,var(--red) 25%,transparent);}

.btn-sm{min-height:36px;padding:7px 11px;border-radius:11px;font-size:12px;}

/* Tarjetas y paneles */
.cards{gap:14px;margin-bottom:24px;}
.card,.panel{
  background:linear-gradient(145deg,color-mix(in srgb,var(--bg2) 98%,white 2%),var(--bg2));

.card{padding:18px 18px 17px;min-width:0;position:relative;overflow:hidden;}

.card .label{font-size:12px;font-weight:600;letter-spacing:.005em;line-height:1.4;}
.card .val{font-size:clamp(22px,2vw,28px);font-weight:760;letter-spacing:-.045em;line-height:1.15;margin-top:8px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;}
.card .sub{font-size:11px;line-height:1.4;margin-top:5px;color:var(--dim);}
.panel{overflow:hidden;}
.panel[style*="padding"]{box-shadow:var(--cochi-shadow-small);}
.summary-line{gap:12px;align-items:center;min-height:29px;padding:5px 0;}

.b-cancelada{background:rgba(255,95,86,.13);color:#ff8a83;}
.empty{padding:30px 16px;line-height:1.55;font-size:13px;}

/* Tablas escritorio */
.panel:has(table){overflow-x:auto;}
table{border-collapse:separate;border-spacing:0;}

td{padding:14px 16px;font-size:13px;vertical-align:middle;}
tbody tr{transition:background-color .16s ease;}
tbody tr:hover{background:color-mix(in srgb,var(--text) 2.5%,transparent);}
td button{white-space:nowrap;}
.toolbar{gap:10px;margin-bottom:18px;}
.toolbar input,.toolbar select{min-width:190px;}

/* Calendarios */
.financial-picker-wrap{min-width:190px;}

/* Constructor de órdenes */
.order-mobile-summary{display:none;}
.customer-result,.product-pick-button{border-radius:12px!important;}
.customer-result:hover,.product-pick-button:hover{background:color-mix(in srgb,var(--accent) 6%,var(--bg2));}
.product-pick-button{padding:12px!important;min-height:68px;}

.order-cart-panel{border-radius:20px;}

/* Modales / bottom sheets */
body.modal-open{overflow:hidden;}

.modal-actions{gap:10px;margin-top:22px;}
.modal-actions button{min-height:48px;border-radius:14px;}
.field label{line-height:1.35;}

/* Inicio de sesión */

.login-box p{font-size:13px;line-height:1.5;}

/* Notificaciones */
#toast{z-index:150;max-width:calc(100vw - 28px);padding:12px 16px;border:1px solid var(--cochi-border);border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.28);backdrop-filter:blur(18px);font-size:13px;line-height:1.4;}

/* ==========================================================
   COCHI Motion — animaciones sutiles, rápidas y accesibles
   Solo se activan al entrar a una sección o abrir un elemento.
   ========================================================== */
@keyframes cochi-view-enter{
  from{opacity:0;transform:translate3d(0,9px,0)}
  to{opacity:1;transform:translate3d(0,0,0)}
}
@keyframes cochi-card-enter{
  0%{opacity:0;transform:translate3d(0,12px,0) scale(.988)}
  100%{opacity:1;transform:translate3d(0,0,0) scale(1)}
}
@keyframes cochi-soft-enter{
  from{opacity:0;transform:translateY(5px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes cochi-overlay-enter{from{opacity:0}to{opacity:1}}
@keyframes cochi-modal-enter{
  from{opacity:0;transform:translate3d(0,12px,0) scale(.982)}
  to{opacity:1;transform:translate3d(0,0,0) scale(1)}
}
@keyframes cochi-sheet-enter{
  from{opacity:.75;transform:translate3d(0,34px,0)}
  to{opacity:1;transform:translate3d(0,0,0)}
}
@keyframes cochi-overlay-exit{to{opacity:0}}
@keyframes cochi-modal-exit{
  to{opacity:0;transform:translate3d(0,12px,0) scale(.985)}
}
@keyframes cochi-sheet-exit{to{opacity:0;transform:translate3d(0,28px,0)}}
@keyframes cochi-menu-enter{
  from{opacity:0;transform:translate3d(0,8px,0) scale(.985)}
  to{opacity:1;transform:translate3d(0,0,0) scale(1)}
}
@keyframes cochi-toast-enter{
  from{opacity:0;transform:translate(-50%,10px) scale(.98)}
  to{opacity:1;transform:translate(-50%,0) scale(1)}
}
@keyframes cochi-nav-select{
  0%{transform:scale(.86)}
  65%{transform:scale(1.08)}
  100%{transform:scale(1)}
}
@keyframes cochi-chart-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

main.cochi-view-enter{animation:cochi-view-enter .32s cubic-bezier(.2,.72,.25,1) both;}
main.cochi-view-enter>.topbar{animation:cochi-soft-enter .3s ease-out both;animation-delay:25ms;}
main.cochi-view-enter>.cards>.card{
  animation:cochi-card-enter .42s cubic-bezier(.2,.72,.25,1) both;
  animation-delay:calc(var(--cochi-stagger,0) * 42ms + 35ms);
}
main.cochi-view-enter>.panel,
main.cochi-view-enter>.row2{
  animation:cochi-soft-enter .38s ease-out both;
  animation-delay:75ms;
}
main.cochi-view-enter .summary-line span[style*="height:6px"]{
  transform-origin:left center;
  animation:cochi-chart-grow .48s cubic-bezier(.2,.7,.2,1) both;
}
.cochi-login-enter{animation:cochi-modal-enter .42s cubic-bezier(.2,.72,.25,1) both;}
.overlay:not(.cochi-overlay-exit){animation:cochi-overlay-enter .18s ease-out both;}
.overlay:not(.cochi-overlay-exit)>.modal{animation:cochi-modal-enter .25s cubic-bezier(.2,.75,.25,1) both;}
.overlay.cochi-overlay-exit{animation:cochi-overlay-exit .17s ease-in both;pointer-events:none;}
.modal.cochi-modal-exit{animation:cochi-modal-exit .17s ease-in both;}
#mobile-more-menu.open{transform-origin:bottom center;animation:cochi-menu-enter .22s cubic-bezier(.2,.75,.25,1) both;}
.cochi-nav-enter .nav-icon svg{animation:cochi-nav-select .24s cubic-bezier(.2,.75,.25,1) both;}
#toast.show{animation:cochi-toast-enter .22s cubic-bezier(.2,.75,.25,1) both;}
.financial-calendar{transform-origin:top right;animation:cochi-menu-enter .2s ease-out both;}

button{transform-origin:center;}
button:active{transform:scale(.975);transition-duration:.07s;}
.btn-primary:active{box-shadow:0 1px 4px color-mix(in srgb,var(--accent) 18%,transparent);}
input,select,textarea{transition:border-color .18s ease,box-shadow .18s ease,background-color .18s ease;}
@media(hover:hover) and (pointer:fine){
  .card{transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;}
  .card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 18%,var(--cochi-border));box-shadow:0 9px 24px rgba(0,0,0,.13);}
  .nav-item,.btn-ghost,.btn-primary,.btn-danger{transition:background-color .18s ease,border-color .18s ease,box-shadow .18s ease,color .18s ease,transform .16s ease;}
}
@media(max-width:820px){
  .overlay:not(.cochi-overlay-exit)>.modal{animation:cochi-sheet-enter .28s cubic-bezier(.2,.75,.25,1) both;}
  .modal.cochi-modal-exit{animation:cochi-sheet-exit .16s ease-in both;}
  #mobile-more-menu.open{animation-duration:.2s;}
  #mobile-nav button:active{background:color-mix(in srgb,var(--accent) 12%,transparent);}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto!important;}
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important;}
}
