<!DOCTYPE html>
<html lang="es">
<head>
<link rel="manifest" href="/manifest.json">

<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">

<link rel="apple-touch-icon" sizes="192x192" href="/icons/cochi-192.png">

<meta name="theme-color" content="#151515">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="COCHI">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>COCHI — Administración</title>
<style>
:root{
  --bg:#1c1a17; --bg2:#242019; --bg3:#2e2820; --border:#3d362b;
  --text:#f3ede2; --dim:#b3a591; --accent:#e8a33d; --accent-d:#c8842a;
  --green:#7db07d; --blue:#7ba3b8; --red:#c9705f; --yellow:#d9c25e;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
input,select,textarea{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:1px solid var(--accent)}
label{font-size:13px;color:var(--dim);display:block;margin-bottom:4px}
.field{margin-bottom:12px}
button{cursor:pointer;border:none;border-radius:8px;padding:9px 16px;font-weight:600}
button:disabled{opacity:.6;cursor:default}
.btn-primary{background:var(--accent);color:#241a08}
.btn-primary:hover{background:var(--accent-d)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--accent)}
.btn-danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn-sm{padding:5px 10px;font-size:13px}
a{color:var(--accent)}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:36px 32px;width:100%;max-width:360px}
.login-box h1{font-size:26px;margin-bottom:2px}
.login-box p{color:var(--dim);font-size:14px;margin-bottom:22px}
.login-err{color:var(--red);font-size:13px;margin-top:8px;min-height:16px}

/* shell */
#shell{display:flex;min-height:100vh}
#sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);padding:20px 14px;flex-shrink:0}
#sidebar h1{font-size:20px;margin-bottom:2px}
#sidebar .tag{color:var(--dim);font-size:12px;margin-bottom:22px}
.nav-item{display:block;width:100%;text-align:left;background:none;border:none;color:var(--dim);padding:10px 12px;border-radius:8px;margin-bottom:2px;font-weight:500}
.nav-item.active{background:var(--bg3);color:var(--accent)}
.nav-item:hover{color:var(--text)}
#logout{margin-top:20px;width:100%}
main{flex:1;padding:26px 30px;max-width:1100px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:10px}
.topbar h2{font-size:22px}
#mobile-nav{display:none}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card .label{color:var(--dim);font-size:13px}
.card .val{font-size:24px;font-weight:700;margin-top:4px}
.card .sub{font-size:12px;color:var(--dim);margin-top:2px}

/* tables */
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--dim);padding:12px 14px;border-bottom:1px solid var(--border)}
td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:14px}
tr:last-child td{border-bottom:none}
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{width:auto;min-width:140px}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600}
.b-pendiente{background:#4a4126;color:var(--yellow)}
.b-preparacion{background:#2c3d47;color:var(--blue)}
.b-lista{background:#2c3d47;color:var(--blue)}
.b-delivery{background:#2c3d47;color:var(--blue)}
.b-completada{background:#2e4530;color:var(--green)}
.b-cancelada{background:#4a2c26;color:var(--red)}
.empty{padding:40px;text-align:center;color:var(--dim)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:50}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:26px;width:100%;max-width:560px}
.modal h3{margin-bottom:16px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* order builder */
.ob-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.prod-pick{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px solid var(--border)}
.prod-pick:last-child{border-bottom:none}
.cart-line{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px solid var(--border)}
.cart-line:last-child{border-bottom:none}
.summary-line{display:flex;justify-content:space-between;font-size:14px;padding:4px 0}
.summary-line.total{font-weight:700;font-size:17px;border-top:1px solid var(--border);margin-top:8px;padding-top:10px}
.qty-ctrl{display:flex;align-items:center;gap:6px}
.qty-ctrl button{padding:2px 10px;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;font-weight:700}
.qty-ctrl button:hover{border-color:var(--accent)}

/* ticket */
#ticket{display:none}
@media print{
  body>*:not(#ticket-overlay){display:none!important}
  #ticket-overlay{position:static;background:none;padding:0}
  #ticket{display:block!important;width:58mm;font-family:monospace;font-size:11px;color:#000;padding:4px}
  #ticket hr{border:none;border-top:1px dashed #000;margin:6px 0}
  #ticket .c{text-align:center}
  #ticket .row{display:flex;justify-content:space-between}
}
.ticket-preview .c{text-align:center}
.ticket-preview .row{display:flex;justify-content:space-between;padding:2px 0}
.ticket-preview hr{border:none;border-top:1px dashed #999;margin:6px 0}

/* toast */
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:100;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{border-color:var(--red);color:var(--red)}

@media (max-width:820px){
  #sidebar{display:none}
  main{padding:16px;max-width:100%}
  #mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);z-index:40}
  #mobile-nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;color:var(--dim);padding:8px 2px;border-radius:0}
  #mobile-nav button.active{color:var(--accent)}
  #shell{padding-bottom:60px}
  .ob-grid{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr}
  .panel{overflow-x:auto}
  table{min-width:540px}
  .card .val{font-size:20px}
  #toast{bottom:70px}
}


/* ==========================================================
   COCHI UX 2026 — optimización de uso diario en el teléfono
   Sin ocultar ni eliminar funciones de administración.
   ========================================================== */
:root { color-scheme: dark; --touch-target: 44px; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-behavior: smooth; }
body { overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { touch-action: manipulation; }
button { min-height: var(--touch-target); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible,
[role="button"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select, textarea { min-height: 44px; }
textarea { resize: vertical; }
.panel, .card, .modal, .login-box { box-shadow: 0 3px 12px rgba(0,0,0,.08); }
.topbar { align-items: center; }
.topbar h2 { line-height: 1.2; }
.prod-pick { min-height: 48px; gap: 10px; }
.prod-pick > span:first-child { min-width: 0; overflow-wrap: anywhere; }
.qty-ctrl { flex-wrap: wrap; }
.qty-ctrl button { min-width: 40px; min-height: 40px; }
.badge { line-height: 1.35; }
.empty { line-height: 1.5; }

/* Menú secundario para que la navegación inferior no quede comprimida. */
#mobile-more-backdrop { display: none; }
#mobile-more-menu { display: none; }

@media (max-width: 820px) {
  html { scroll-padding-bottom: 100px; }
  body { min-height: 100dvh; }
  main { padding: 14px 12px calc(92px + env(safe-area-inset-bottom)); max-width: 100%; width: 100%; }
  #shell { min-height: 100dvh; padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
  .topbar { gap: 12px; margin-bottom: 16px; }
  .topbar h2 { font-size: 23px; flex: 1 1 100%; }
  .topbar > button { width: 100%; }
  .toolbar { gap: 8px; }
  .toolbar input, .toolbar select { width: 100%; min-width: 0 !important; }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin-bottom: 16px; }
  .card { min-width: 0; padding: 13px 12px; border-radius: 12px; }
  .card .label { font-size: 12px; line-height: 1.35; }
  .card .val { font-size: clamp(18px, 5.2vw, 23px); overflow-wrap: anywhere; }
  .card .sub { line-height: 1.4; overflow-wrap: anywhere; }
  .row2 { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .ob-grid { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .ob-grid > div { min-width: 0; }
  .panel { border-radius: 12px; }
  .panel[style*="padding:18px"], .panel[style*="padding:20px"] { padding: 14px !important; }
  .field { margin-bottom: 14px; }
  label { line-height: 1.35; }
  .modal-actions { gap: 8px; }
  .modal-actions button { min-height: 46px; }
  .cart-line { align-items: flex-start; gap: 8px; flex-wrap: wrap; }
  .cart-line > span:first-child { flex: 1 1 100%; overflow-wrap: anywhere; }
  .qty-ctrl { justify-content: flex-end; width: 100%; }
  .summary-line { gap: 10px; }
  .summary-line > span { min-width: 0; overflow-wrap: anywhere; }

  /* Las tablas se convierten en fichas verticales fáciles de leer y tocar. */
  .panel:has(table) { overflow: visible; }
  table { width: 100% !important; min-width: 0 !important; border-collapse: separate; border-spacing: 0; }
  table thead { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  table tbody { display: block; width: 100%; }
  table tbody tr { display: block; margin: 0 0 10px; padding: 3px 12px; background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  table tbody tr:last-child { margin-bottom: 0; }
  table tbody td { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; width: 100%; padding: 10px 0; border-bottom: 1px solid var(--border); text-align: right; font-size: 13px; overflow-wrap: anywhere; }
  table tbody td::before { content: attr(data-label); flex: 0 0 34%; max-width: 40%; color: var(--dim); text-align: left; font-size: 11px; line-height: 1.4; font-weight: 700; }
  table tbody td > * { min-width: 0; max-width: 100%; }
  table tbody td select { flex: 0 1 62%; min-height: 40px; padding: 6px 8px !important; font-size: 13px !important; }
  table tbody td.mobile-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; padding-top: 10px; border-bottom: 0; }
  table tbody td.mobile-actions::before { content: none; }
  table tbody td[colspan] { display: block; text-align: center; padding: 18px 6px; border: 0; }
  table tbody td[colspan]::before { content: none; }
  table .btn-sm { min-height: 38px; padding: 7px 10px; }

  /* Barra inferior con cuatro accesos primarios y un menú para lo demás. */
  #mobile-nav { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: stretch; gap: 2px; position: fixed; left: 0; right: 0; bottom: 0; min-height: 66px; padding: 5px 5px calc(5px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg2) 94%, transparent); border-top: 1px solid var(--border); box-shadow: 0 -5px 24px rgba(0,0,0,.2); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 45; }
  #mobile-nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 0; min-height: 50px; padding: 4px 2px; border-radius: 10px; background: transparent; border: 0; color: var(--dim); line-height: 1.1; }
  #mobile-nav button.active { color: var(--accent); background: var(--bg3); }
  #mobile-nav .mobile-nav-icon { font-size: 19px; line-height: 1; }
  #mobile-nav .mobile-nav-label { max-width: 100%; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #mobile-nav #mobile-more-toggle { font-size: 19px; }
  #mobile-more-backdrop { display: block; position: fixed; inset: 0; bottom: calc(66px + env(safe-area-inset-bottom)); border: 0; border-radius: 0; min-height: 0; padding: 0; background: rgba(0,0,0,.22); z-index: 41; }
  #mobile-more-menu { display: block; position: fixed; right: 10px; bottom: calc(74px + env(safe-area-inset-bottom)); width: min(290px, calc(100vw - 20px)); max-height: min(66dvh, 500px); overflow-y: auto; padding: 12px; border: 1px solid var(--border); border-radius: 16px; background: var(--bg2); box-shadow: 0 16px 44px rgba(0,0,0,.42); z-index: 46; }
  #mobile-more-menu .more-title { color: var(--dim); font-size: 12px; font-weight: 700; padding: 4px 8px 10px; }
  #mobile-more-menu [data-nav], #mobile-more-menu #mobile-logout { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 46px; margin: 2px 0; padding: 10px 12px; border-radius: 10px; text-align: left; background: transparent; color: var(--text); border: 0; }
  #mobile-more-menu [data-nav].active { color: var(--accent); background: var(--bg3); }
  #mobile-more-menu .more-icon { width: 25px; text-align: center; font-size: 18px; }
  #mobile-more-menu #mobile-logout { margin-top: 8px; border-top: 1px solid var(--border); border-radius: 0 0 8px 8px; color: var(--red); }
  #toast { left: 12px; right: 12px; bottom: calc(76px + env(safe-area-inset-bottom)); max-width: none; transform: translateY(16px); }
  #toast.show { transform: translateY(0); }

  /* Formularios como hoja inferior, con scroll propio y área segura. */
  .overlay { align-items: flex-end; justify-content: center; padding: max(8px, env(safe-area-inset-top)) 0 0; }
  .modal { width: 100%; max-width: 100% !important; max-height: calc(100dvh - 8px); overflow-y: auto; overscroll-behavior: contain; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); border-radius: 18px 18px 0 0; border-bottom: 0; }
  .modal h3 { position: sticky; top: -20px; z-index: 3; padding: 5px 0 12px; margin: 0 0 14px; background: var(--bg2); font-size: 20px; }
  .modal-actions { display: flex; flex-direction: column-reverse; position: sticky; bottom: calc(-20px - env(safe-area-inset-bottom)); margin: 18px -16px calc(-20px - env(safe-area-inset-bottom)); padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); background: var(--bg2); border-top: 1px solid var(--border); z-index: 2; }
  .modal-actions button { width: 100%; }
  .login-box { padding: 28px 22px; }
  .login-box button { min-height: 48px; }
}

@media (max-width: 380px) {
  main { padding-left: 10px; padding-right: 10px; }
  .cards { gap: 7px; }
  .card { padding: 11px 9px; }
  #mobile-nav .mobile-nav-label { font-size: 9px; }
  table tbody tr { padding-left: 9px; padding-right: 9px; }
  table tbody td::before { flex-basis: 31%; max-width: 36%; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
}

</style>
</head>
<body>
<div id="root"></div>
<div id="ticket-overlay"><div id="ticket"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="/pwa-install.js"></script>

</body>
</html>
